<!-- 面包屑（使用 position 数组，对齐 default 主题用法，无背景轻量文字条）
     统一放在 header 下方通栏顶部（各模板 container 第一个元素），不再嵌进内容列 -->
{{if position && position.length}}
<nav class="text-slate-500 mb-4">
  <ol class="crumb flex items-center flex-wrap gap-2 text-sm">
    <li>
      <a href="/" class="hover:text-primary transition flex items-center gap-1">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        首页
      </a>
    </li>
    {{each position}}
    <li class="flex items-center gap-2">
      <svg class="w-3.5 h-3.5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      {{if $index < position.length - 1}}
      {{if $value.url}}
      <a href="{{$value.url}}" {{if $value.target == 1}}target="_blank" rel="noopener noreferrer"{{/if}} class="hover:text-primary transition">{{$value.name}}</a>
      {{else}}
      {{if $value.type == 1}}
      <a href="{{$value.path}}/page.html" class="hover:text-primary transition">{{$value.name}}</a>
      {{else}}
      <a href="{{$value.path}}/index.html" class="hover:text-primary transition">{{$value.name}}</a>
      {{/if}}
      {{/if}}
      {{else}}
        <span class="text-slate-800 font-medium">{{$value.name}}</span>
      {{/if}}
    </li>
    {{/each}}
  </ol>
</nav>
{{/if}}
